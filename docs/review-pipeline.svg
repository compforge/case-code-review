<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <title>CCR review pipeline from Diff to Finding</title>
  <desc>
    A diff is organized into review Units and enriched with Clues. Divergent
    Unit Review produces Hypotheses in a Dossier. Independent Hypothesis Review
    produces Assessments, and deterministic Trial publishes Findings. Language
    Knowledge and Project Knowledge support the whole review flow.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#111827" stroke-width="1.8"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Arial, sans-serif;
        fill: #111827;
      }
      .title { font-size: 29px; font-weight: 650; }
      .label { font-size: 21px; font-weight: 650; }
      .small { font-size: 16px; }
      .tiny { font-size: 13px; }
      .box { stroke: #111827; stroke-width: 2.6; }
      .soft-box { stroke: #8a94a6; stroke-width: 1.8; }
      .flow { fill: none; stroke: #111827; stroke-width: 2.8; marker-end: url(#arrow); }
      .knowledge-line { fill: none; stroke: #5b7f86; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="520" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">CCR · Diff → Finding</text>
  <text x="900" y="82" text-anchor="middle" class="small">
    先按行为组织改动并提出 Hypothesis，再独立复核证据，最后确定性裁决
  </text>

  <rect x="40" y="185" width="130" height="150" rx="18" fill="#e7edf8" class="box"/>
  <text x="105" y="250" text-anchor="middle" class="label">Diff</text>
  <text x="105" y="279" text-anchor="middle" class="small">代码改动</text>

  <line x1="170" y1="260" x2="205" y2="260" class="flow"/>

  <rect x="220" y="185" width="210" height="150" rx="18" fill="#eef3fb" class="box"/>
  <text x="325" y="238" text-anchor="middle" class="label">Unit + Clues</text>
  <text x="325" y="270" text-anchor="middle" class="small">行为作用域</text>
  <text x="325" y="298" text-anchor="middle" class="tiny">spec · case · rule · link · doc</text>

  <line x1="430" y1="260" x2="465" y2="260" class="flow"/>

  <rect x="480" y="170" width="210" height="180" rx="18" fill="#eee8ff" class="box"/>
  <text x="585" y="224" text-anchor="middle" class="label">Unit Review</text>
  <text x="585" y="258" text-anchor="middle" class="small">发散调查</text>
  <rect x="515" y="282" width="140" height="36" rx="18" fill="#f7f4ff" class="soft-box"/>
  <text x="585" y="306" text-anchor="middle" class="tiny">“侦查” · 类比</text>

  <line x1="690" y1="260" x2="725" y2="260" class="flow"/>

  <rect x="740" y="170" width="220" height="180" rx="18" fill="#fff0bf" class="box"/>
  <text x="850" y="220" text-anchor="middle" class="label">Dossier</text>
  <text x="850" y="254" text-anchor="middle" class="small">Hypotheses</text>
  <text x="850" y="284" text-anchor="middle" class="tiny">ChangeSet + Clues</text>
  <text x="850" y="312" text-anchor="middle" class="tiny">待证伪，不是最终评论</text>

  <line x1="960" y1="260" x2="995" y2="260" class="flow"/>

  <rect x="1010" y="170" width="220" height="180" rx="18" fill="#eee8ff" class="box"/>
  <text x="1120" y="220" text-anchor="middle" class="label">Hypothesis Review</text>
  <text x="1120" y="258" text-anchor="middle" class="small">独立收敛</text>
  <rect x="1050" y="282" width="140" height="36" rx="18" fill="#f7f4ff" class="soft-box"/>
  <text x="1120" y="306" text-anchor="middle" class="tiny">“复核” · 类比</text>

  <line x1="1230" y1="260" x2="1265" y2="260" class="flow"/>

  <rect x="1280" y="185" width="160" height="150" rx="18" fill="#eef3fb" class="box"/>
  <text x="1360" y="244" text-anchor="middle" class="label">Assessment</text>
  <text x="1360" y="276" text-anchor="middle" class="small">证据支持度</text>
  <text x="1360" y="302" text-anchor="middle" class="tiny">+ 交付价值</text>

  <line x1="1440" y1="260" x2="1460" y2="260" class="flow"/>

  <circle cx="1530" cy="260" r="65" fill="#e7f7ee" class="box"/>
  <text x="1530" y="247" text-anchor="middle" class="label">Trial</text>
  <text x="1530" y="276" text-anchor="middle" class="small">确定性裁决</text>
  <text x="1530" y="300" text-anchor="middle" class="tiny">“审判” · 类比</text>

  <line x1="1595" y1="260" x2="1625" y2="260" class="flow"/>

  <rect x="1640" y="205" width="120" height="110" rx="55" fill="#dff5e8" class="box"/>
  <text x="1700" y="253" text-anchor="middle" class="label">Finding</text>
  <text x="1700" y="281" text-anchor="middle" class="tiny">最终交付</text>

  <!-- Knowledge foundations shared by Unit formation and both review stages. -->
  <path d="M325 335 V375 H1150 M585 350 V375 M850 350 V375 M1120 350 V375" class="knowledge-line"/>
  <line x1="650" y1="375" x2="650" y2="397" class="knowledge-line"/>
  <line x1="1150" y1="375" x2="1150" y2="397" class="knowledge-line"/>

  <rect x="440" y="397" width="420" height="88" rx="18" fill="#e8f4f6" class="soft-box"/>
  <text x="650" y="430" text-anchor="middle" class="label">Language Knowledge</text>
  <text x="650" y="459" text-anchor="middle" class="small">symbol · definition · reference · call</text>

  <rect x="940" y="397" width="420" height="88" rx="18" fill="#e8f4f6" class="soft-box"/>
  <text x="1150" y="430" text-anchor="middle" class="label">Project Knowledge</text>
  <text x="1150" y="459" text-anchor="middle" class="small">Repository · Component · FileRole · manifest</text>
</svg>
