<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="590" viewBox="0 0 1800 590">
  <title>CCR agentic review pipeline from Diff to Finding</title>
  <desc>
    CCR forms behavioral Units from a diff. Unit Review discovers falsifiable
    Hypotheses, Hypothesis Review independently verifies them, and deterministic
    Trial delivers Findings. Language and Project Knowledge support the flow.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#172033" stroke-width="1.8"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Arial, sans-serif;
        fill: #172033;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #536078; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #536078; }
      .box { stroke: #172033; stroke-width: 2.4; }
      .soft-box { stroke: #8893a8; stroke-width: 1.6; }
      .flow { fill: none; stroke: #172033; stroke-width: 2.6; marker-end: url(#arrow); }
      .knowledge-line { fill: none; stroke: #4f7d86; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="590" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">CCR · Agentic review from Diff to Finding</text>
  <text x="900" y="80" text-anchor="middle" class="subtitle">
    Organize by behavior, separate discovery from verification, deliver only evidence-backed findings
  </text>

  <rect x="35" y="185" width="120" height="125" rx="18" fill="#e7edf8" class="box"/>
  <text x="95" y="240" text-anchor="middle" class="label">Diff</text>
  <text x="95" y="269" text-anchor="middle" class="small">changed code</text>

  <line x1="155" y1="247" x2="200" y2="247" class="flow"/>

  <rect x="215" y="165" width="190" height="165" rx="18" fill="#eef3fb" class="box"/>
  <text x="310" y="218" text-anchor="middle" class="label">Unit</text>
  <text x="310" y="249" text-anchor="middle" class="small">behavioral scope</text>
  <text x="310" y="279" text-anchor="middle" class="tiny">function · file</text>
  <text x="310" y="302" text-anchor="middle" class="tiny">cross-file call chain</text>

  <line x1="405" y1="247" x2="450" y2="247" class="flow"/>

  <rect x="465" y="150" width="210" height="195" rx="18" fill="#eee8ff" class="box"/>
  <text x="570" y="205" text-anchor="middle" class="label">Review 1</text>
  <text x="570" y="237" text-anchor="middle" class="small">Unit Review</text>
  <text x="570" y="269" text-anchor="middle" class="small">discover</text>
  <rect x="505" y="292" width="130" height="32" rx="16" fill="#f8f5ff" class="soft-box"/>
  <text x="570" y="313" text-anchor="middle" class="tiny">investigation</text>

  <line x1="675" y1="247" x2="720" y2="247" class="flow"/>

  <rect x="735" y="175" width="185" height="145" rx="18" fill="#fff0bf" class="box"/>
  <text x="827" y="228" text-anchor="middle" class="label">Hypothesis</text>
  <text x="827" y="260" text-anchor="middle" class="small">falsifiable claim</text>
  <text x="827" y="290" text-anchor="middle" class="tiny">not a public comment</text>

  <line x1="920" y1="247" x2="965" y2="247" class="flow"/>

  <rect x="980" y="150" width="225" height="195" rx="18" fill="#eee8ff" class="box"/>
  <text x="1092" y="205" text-anchor="middle" class="label">Review 2</text>
  <text x="1092" y="237" text-anchor="middle" class="small">Hypothesis Review</text>
  <text x="1092" y="269" text-anchor="middle" class="small">verify</text>
  <rect x="1017" y="292" width="150" height="32" rx="16" fill="#f8f5ff" class="soft-box"/>
  <text x="1092" y="313" text-anchor="middle" class="tiny">prosecutor review</text>

  <line x1="1205" y1="247" x2="1245" y2="247" class="flow"/>

  <rect x="1260" y="175" width="165" height="145" rx="18" fill="#eef3fb" class="box"/>
  <text x="1342" y="228" text-anchor="middle" class="label">Assessment</text>
  <text x="1342" y="260" text-anchor="middle" class="small">evidence verdict</text>
  <text x="1342" y="290" text-anchor="middle" class="tiny">support · value · novelty</text>

  <line x1="1425" y1="247" x2="1460" y2="247" class="flow"/>

  <circle cx="1525" cy="247" r="60" fill="#e7f7ee" class="box"/>
  <text x="1525" y="240" text-anchor="middle" class="label">Trial</text>
  <text x="1525" y="268" text-anchor="middle" class="tiny">court gate</text>

  <line x1="1585" y1="247" x2="1615" y2="247" class="flow"/>

  <rect x="1630" y="192" width="135" height="110" rx="52" fill="#dff5e8" class="box"/>
  <text x="1697" y="240" text-anchor="middle" class="label">Finding</text>
  <text x="1697" y="268" text-anchor="middle" class="tiny">delivered result</text>

  <!-- Shared foundations: they shape Unit formation and both review stages. -->
  <path d="M310 330 V390 H1092 M570 345 V390 M827 320 V390 M1092 345 V390" class="knowledge-line"/>
  <line x1="570" y1="390" x2="570" y2="420" class="knowledge-line"/>
  <line x1="1092" y1="390" x2="1092" y2="420" class="knowledge-line"/>

  <rect x="340" y="420" width="460" height="105" rx="18" fill="#e8f4f6" class="soft-box"/>
  <text x="570" y="460" text-anchor="middle" class="label">Language Knowledge</text>
  <text x="570" y="490" text-anchor="middle" class="small">syntax · symbols · calls · references</text>
  <text x="570" y="515" text-anchor="middle" class="tiny">documentation and contract extraction</text>

  <rect x="862" y="420" width="460" height="105" rx="18" fill="#e8f4f6" class="soft-box"/>
  <text x="1092" y="460" text-anchor="middle" class="label">Project Knowledge</text>
  <text x="1092" y="490" text-anchor="middle" class="small">Repository · Component · FileRole</text>
  <text x="1092" y="515" text-anchor="middle" class="tiny">entrypoint · handler · manifest · lock</text>
</svg>
